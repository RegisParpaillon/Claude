name: Publier les apps (garage + séance)

on:
  push:
    branches: [main]
    paths: ['carnet-entretien/**', 'seance/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assembler le site (garage à la racine, séance dans /seance)
        run: |
          mkdir _site
          cp -r carnet-entretien/. _site/
          cp -r seance _site/seance
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
