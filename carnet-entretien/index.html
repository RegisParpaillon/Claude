<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon garage</title>
<meta name="description" content="Carnet d'entretien de mes véhicules : échéances, factures scannées, historique.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Ajouter">+</button>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="busy" id="busy"><div><div class="spinner"></div><span></span></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="scanFile" accept="image/*,application/pdf" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript>Cette application nécessite JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
