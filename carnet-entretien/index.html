<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet d'entretien</title>
<meta name="description" content="Suivi simple des entretiens de vos véhicules, logement et équipements.">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entretien">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #1d4ed8; --accent-soft: #dbeafe; --danger: #dc2626; --danger-soft: #fee2e2;
    --warn: #b45309; --warn-soft: #fef3c7; --ok: #15803d; --ok-soft: #dcfce7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1c1c1e; --text: #f3f4f6; --muted: #9ca3af; --line: #2c2c2e;
      --accent: #60a5fa; --accent-soft: #1e3a8a; --danger: #f87171; --danger-soft: #450a0a;
      --warn: #fbbf24; --warn-soft: #451a03; --ok: #4ade80; --ok-soft: #052e16;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom)); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px;
    display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 28px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { background: none; border: 0; color: var(--accent); font-size: 17px; padding: 6px 0; cursor: pointer; }
  .icon-btn { background: none; border: 0; color: var(--accent); font-size: 22px; padding: 6px 8px; cursor: pointer; }
  main { padding: 0 16px; max-width: 680px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    font-weight: 600; margin: 20px 4px 8px; }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0;
    color: inherit; font: inherit; text-align: left; }
  .row:last-child { border-bottom: 0; }
  .row .emoji { font-size: 26px; width: 36px; text-align: center; flex: none; }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--muted); font-size: 14px; }
  .row .right { text-align: right; font-size: 14px; color: var(--muted); flex: none; }
  .chev { color: var(--muted); flex: none; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .pill.late { background: var(--danger-soft); color: var(--danger); }
  .pill.soon { background: var(--warn-soft); color: var(--warn); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); width: 58px; height: 58px;
    border-radius: 50%; background: var(--accent); color: #fff; border: 0; font-size: 32px; line-height: 1;
    box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; }
  @media (prefers-color-scheme: dark) { .fab { color: #000; } }
  .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--card);
    color: var(--text); font-size: 16px; margin-top: 4px; }

  /* Feuille modale */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
  .sheet-bg.open { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg);
    border-radius: 16px 16px 0 0; max-height: 92vh; overflow-y: auto; transform: translateY(100%);
    transition: transform .25s ease; padding-bottom: env(safe-area-inset-bottom); max-width: 680px; margin: 0 auto; }
  .sheet.open { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .sheet-head b { font-size: 17px; }
  .sheet-head button { background: none; border: 0; color: var(--accent); font-size: 17px; cursor: pointer; padding: 4px; }
  .sheet-head .save { font-weight: 700; }
  form { padding: 0 16px 24px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 4px 6px; }
  input, select, textarea { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--card);
    color: var(--text); font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; }
  input[type="date"] { min-height: 46px; }
  textarea { min-height: 80px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 99px; padding: 6px 10px;
    font-size: 14px; cursor: pointer; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: 0; font: inherit;
    font-weight: 600; cursor: pointer; margin-top: 12px; background: var(--card); color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.primary { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #000; } }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 30;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .95; }
  .notes { white-space: pre-wrap; }
  .install { background: var(--accent-soft); color: var(--text); border-radius: 14px; padding: 12px 14px;
    margin-top: 12px; font-size: 14px; display: none; }
  .install.show { display: block; }
  .install button { float: right; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Ajouter">+</button>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY = 'carnet-entretien-v1';
const KINDS = {
  voiture: { e: '🚗', label: 'Voiture', km: true },
  moto: { e: '🏍️', label: 'Moto / scooter', km: true },
  velo: { e: '🚲', label: 'Vélo', km: true },
  maison: { e: '🏠', label: 'Logement', km: false },
  chaudiere: { e: '🔥', label: 'Chaudière / chauffage', km: false },
  appareil: { e: '🔧', label: 'Appareil / équipement', km: false },
  autre: { e: '📦', label: 'Autre', km: false },
};
const SUGGEST = {
  voiture: ['Vidange', 'Révision', 'Pneus', 'Freins', 'Contrôle technique', 'Courroie de distribution', 'Batterie', 'Climatisation'],
  moto: ['Vidange', 'Révision', 'Pneus', 'Freins', 'Chaîne', 'Bougies', 'Batterie'],
  velo: ['Révision', 'Chaîne', 'Freins', 'Pneus', 'Dérailleur'],
  maison: ['Ramonage', 'Détecteur de fumée', 'VMC', 'Toiture / gouttières', 'Ballon d\'eau chaude', 'Climatisation'],
  chaudiere: ['Entretien annuel', 'Ramonage', 'Dépannage', 'Remplacement pièce'],
  appareil: ['Entretien', 'Nettoyage', 'Réparation', 'Remplacement filtre'],
  autre: ['Entretien', 'Réparation', 'Contrôle'],
};

/* ---------- Données ---------- */
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.items) && Array.isArray(d.entries)) return d;
  } catch (e) {}
  return { items: [], entries: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('⚠️ Enregistrement impossible'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const itemById = id => db.items.find(i => i.id === id);
const entriesOf = id => db.entries.filter(e => e.itemId === id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtEur = n => (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const fmtKm = n => (Number(n) || 0).toLocaleString('fr-FR') + ' km';
const num = v => v === '' || v == null ? null : Number(String(v).replace(',', '.').replace(/\s/g, ''));
const daysUntil = d => Math.round((new Date(d + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 86400000);
function addMonths(dateStr, m) {
  const d = new Date((dateStr || today()) + 'T12:00:00');
  d.setMonth(d.getMonth() + m);
  return d.toISOString().slice(0, 10);
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- Rappels ---------- */
// Pour chaque équipement + type d'intervention, seule la dernière intervention compte.
function reminders(itemId) {
  const latest = new Map();
  for (const e of db.entries) {
    if (itemId && e.itemId !== itemId) continue;
    const k = e.itemId + '|' + e.title.trim().toLowerCase();
    const cur = latest.get(k);
    if (!cur || (e.date || '') > (cur.date || '')) latest.set(k, e);
  }
  const out = [];
  for (const e of latest.values()) {
    if (!e.nextDate && e.nextKm == null) continue;
    const item = itemById(e.itemId); if (!item) continue;
    let status = 'ok', parts = [];
    if (e.nextDate) {
      const d = daysUntil(e.nextDate);
      if (d < 0) status = 'late'; else if (d <= 30) status = 'soon';
      parts.push(d < 0 ? `en retard de ${-d} j` : d === 0 ? "aujourd'hui" : `dans ${d} j · ${fmtDate(e.nextDate)}`);
    }
    if (e.nextKm != null && item.km != null) {
      const left = e.nextKm - item.km;
      if (left <= 0) status = 'late'; else if (left <= 1000 && status !== 'late') status = 'soon';
      parts.push(left <= 0 ? `dépassé de ${fmtKm(-left)}` : `encore ${fmtKm(left)}`);
    } else if (e.nextKm != null) parts.push(`à ${fmtKm(e.nextKm)}`);
    out.push({ entry: e, item, status, text: parts.join(' · '),
      sort: status === 'late' ? 0 : status === 'soon' ? 1 : 2, when: e.nextDate || '9999' });
  }
  return out.sort((a, b) => a.sort - b.sort || a.when.localeCompare(b.when));
}
const pill = s => `<span class="pill ${s}">${s === 'late' ? 'En retard' : s === 'soon' ? 'Bientôt' : 'À venir'}</span>`;

/* ---------- Navigation ---------- */
let view = { name: 'home' };
function go(v) { view = v; render(); window.scrollTo(0, 0); }

function render() {
  if (view.name === 'item' && !itemById(view.id)) view = { name: 'home' };
  if (view.name === 'home') renderHome();
  else if (view.name === 'item') renderItem(view.id);
  else if (view.name === 'settings') renderSettings();
}

function renderHome() {
  $('#hdr').innerHTML = `<h1>Entretien</h1><button class="icon-btn" id="setBtn" aria-label="Réglages">⚙️</button>`;
  $('#setBtn').onclick = () => go({ name: 'settings' });
  $('#fab').style.display = '';
  $('#fab').onclick = () => db.items.length ? openEntryForm({}) : openItemForm();

  const rem = reminders().filter(r => r.status !== 'ok');
  let h = '';
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  let hideInstall = false; try { hideInstall = localStorage.getItem('hideInstall') === '1'; } catch (e) {}
  if (isIos && !standalone && !hideInstall) {
    h += `<div class="install show"><button id="closeInstall" aria-label="Fermer">✕</button>
      <b>Installer sur l'iPhone :</b> touchez <b>Partager</b> <span aria-hidden="true">⬆️</span> puis
      <b>« Sur l'écran d'accueil »</b>.</div>`;
  }
  if (rem.length) {
    h += `<h2>À faire</h2><div class="card">` + rem.map(r => `
      <button class="row" data-item="${r.item.id}">
        <div class="emoji">${KINDS[r.item.kind]?.e || '📦'}</div>
        <div class="body"><div class="title">${esc(r.entry.title)} — ${esc(r.item.name)}</div>
        <div class="sub">${esc(r.text)}</div></div>${pill(r.status)}</button>`).join('') + `</div>`;
  }
  h += `<h2>Mes équipements</h2>`;
  if (!db.items.length) {
    h += `<div class="card"><div class="empty">Aucun équipement pour l'instant.<br>
      Ajoutez votre voiture, votre chaudière, votre logement…
      <button class="btn primary" id="firstItem">Ajouter un équipement</button></div></div>`;
  } else {
    h += `<div class="card">` + db.items.map(it => {
      const es = entriesOf(it.id), last = es[0];
      const r = reminders(it.id).find(x => x.status !== 'ok');
      return `<button class="row" data-item="${it.id}">
        <div class="emoji">${KINDS[it.kind]?.e || '📦'}</div>
        <div class="body"><div class="title">${esc(it.name)}</div>
        <div class="sub">${last ? 'Dernier : ' + esc(last.title) + ' · ' + fmtDate(last.date) : 'Aucune intervention'}</div></div>
        ${r ? pill(r.status) : ''}<span class="chev">›</span></button>`;
    }).join('') + `</div>
    <button class="btn" id="addItem">＋ Ajouter un équipement</button>`;
  }
  $('#app').innerHTML = h;
  $('#app').querySelectorAll('[data-item]').forEach(b => b.onclick = () => go({ name: 'item', id: b.dataset.item }));
  $('#firstItem') && ($('#firstItem').onclick = () => openItemForm());
  $('#addItem') && ($('#addItem').onclick = () => openItemForm());
  $('#closeInstall') && ($('#closeInstall').onclick = () => { try { localStorage.setItem('hideInstall', '1'); } catch (e) {} render(); });
}

function renderItem(id) {
  const it = itemById(id), k = KINDS[it.kind] || KINDS.autre;
  $('#hdr').innerHTML = `<button class="back" id="back">‹ Retour</button><h1></h1>
    <button class="icon-btn" id="editItem" aria-label="Modifier">✏️</button>`;
  $('#back').onclick = () => go({ name: 'home' });
  $('#editItem').onclick = () => openItemForm(it);
  $('#fab').style.display = '';
  $('#fab').onclick = () => openEntryForm({ itemId: id });

  const es = entriesOf(id);
  const year = new Date().getFullYear().toString();
  const total = es.reduce((s, e) => s + (Number(e.cost) || 0), 0);
  const totalYear = es.filter(e => (e.date || '').startsWith(year)).reduce((s, e) => s + (Number(e.cost) || 0), 0);
  let h = `<div style="display:flex;align-items:center;gap:12px;margin:4px 0 8px">
    <div style="font-size:44px">${k.e}</div><div><div style="font-size:24px;font-weight:700">${esc(it.name)}</div>
    <div class="sub" style="color:var(--muted)">${esc(k.label)}${it.info ? ' · ' + esc(it.info) : ''}</div></div></div>`;
  h += `<div class="stats">
    ${k.km ? `<button class="stat" id="kmBtn" style="border:0;text-align:left;font:inherit;color:inherit;cursor:pointer">
      <b>${it.km != null ? fmtKm(it.km) : '—'}</b><span>Kilométrage · toucher pour MAJ</span></button>`
      : `<div class="stat"><b>${es.length}</b><span>Intervention${es.length > 1 ? 's' : ''}</span></div>`}
    <div class="stat"><b>${fmtEur(totalYear)}</b><span>Dépensé en ${year}</span></div>
  </div>`;
  const rem = reminders(id);
  if (rem.length) {
    h += `<h2>Prochaines échéances</h2><div class="card">` + rem.map(r => `
      <button class="row" data-entry="${r.entry.id}"><div class="body"><div class="title">${esc(r.entry.title)}</div>
      <div class="sub">${esc(r.text)}</div></div>${pill(r.status)}</button>`).join('') + `</div>`;
  }
  h += `<h2>Historique${es.length ? ' · total ' + fmtEur(total) : ''}</h2>`;
  if (!es.length) h += `<div class="card"><div class="empty">Aucune intervention.<br>Touchez <b>+</b> pour en ajouter une.</div></div>`;
  else h += `<div class="card">` + es.map(e => `
    <button class="row" data-entry="${e.id}"><div class="body">
      <div class="title">${esc(e.title)}</div>
      <div class="sub">${fmtDate(e.date)}${e.km != null ? ' · ' + fmtKm(e.km) : ''}${e.provider ? ' · ' + esc(e.provider) : ''}</div>
      ${e.notes ? `<div class="sub notes">${esc(e.notes)}</div>` : ''}
    </div><div class="right">${e.cost ? fmtEur(e.cost) : ''}</div></button>`).join('') + `</div>`;
  $('#app').innerHTML = h;
  $('#app').querySelectorAll('[data-entry]').forEach(b => b.onclick = () => openEntryForm(db.entries.find(e => e.id === b.dataset.entry)));
  $('#kmBtn') && ($('#kmBtn').onclick = () => {
    const v = prompt('Kilométrage actuel', it.km ?? '');
    if (v === null) return;
    const n = num(v);
    if (n == null || isNaN(n)) return toast('Valeur invalide');
    it.km = n; save(); render(); toast('Kilométrage mis à jour');
  });
}

function renderSettings() {
  $('#hdr').innerHTML = `<button class="back" id="back">‹ Retour</button><h1></h1>`;
  $('#back').onclick = () => go({ name: 'home' });
  $('#fab').style.display = 'none';
  $('#app').innerHTML = `
    <h1 style="font-size:28px;margin:4px 0 0">Réglages</h1>
    <h2>Sauvegarde</h2>
    <div class="card" style="padding:14px">
      <div style="font-size:14px;color:var(--muted)">Vos données restent uniquement sur ce téléphone.
      Exportez régulièrement une sauvegarde (vers Fichiers, iCloud Drive, mail…) pour ne rien perdre.</div>
      <button class="btn primary" id="exp">Exporter une sauvegarde</button>
      <button class="btn" id="imp">Importer une sauvegarde</button>
    </div>
    <h2>Données</h2>
    <div class="card" style="padding:14px;font-size:14px;color:var(--muted)">
      ${db.items.length} équipement(s), ${db.entries.length} intervention(s).
      <button class="btn danger" id="wipe">Tout effacer</button>
    </div>
    <p class="hint" style="text-align:center;margin-top:24px">Carnet d'entretien · fonctionne hors ligne</p>`;
  $('#exp').onclick = exportData;
  $('#imp').onclick = () => $('#importFile').click();
  $('#wipe').onclick = () => {
    if (!confirm('Effacer tous les équipements et interventions ? Cette action est définitive.')) return;
    db = { items: [], entries: [] }; save(); go({ name: 'home' }); toast('Données effacées');
  };
}

/* ---------- Formulaires ---------- */
function openSheet(title, inner, onSave) {
  $('#sheet').innerHTML = `<div class="sheet-head"><button type="button" id="sCancel">Annuler</button>
    <b>${esc(title)}</b><button type="button" class="save" id="sSave">OK</button></div>${inner}`;
  $('#sheetBg').classList.add('open');
  requestAnimationFrame(() => $('#sheet').classList.add('open'));
  $('#sCancel').onclick = closeSheet;
  $('#sheetBg').onclick = closeSheet;
  const form = $('#sheet form');
  const submit = ev => { ev && ev.preventDefault(); if (onSave(form) !== false) closeSheet(); };
  $('#sSave').onclick = submit;
  form.onsubmit = submit;
}
function closeSheet() {
  $('#sheet').classList.remove('open'); $('#sheetBg').classList.remove('open');
  document.activeElement && document.activeElement.blur();
}

function openItemForm(it) {
  const isNew = !it; it = it || { kind: 'voiture' };
  const opts = Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${k === it.kind ? 'selected' : ''}>${v.e} ${v.label}</option>`).join('');
  openSheet(isNew ? 'Nouvel équipement' : 'Modifier', `<form autocomplete="off">
    <label for="fKind">Type</label><select id="fKind" name="kind">${opts}</select>
    <label for="fName">Nom</label><input id="fName" name="name" required placeholder="ex. Clio, Chaudière Vaillant…" value="${esc(it.name || '')}">
    <label for="fInfo">Infos (facultatif)</label><input id="fInfo" name="info" placeholder="Immatriculation, modèle, adresse…" value="${esc(it.info || '')}">
    <div id="kmWrap"><label for="fKm">Kilométrage actuel</label>
    <input id="fKm" name="km" inputmode="numeric" placeholder="ex. 85000" value="${it.km ?? ''}"></div>
    ${isNew ? '' : '<button type="button" class="btn danger" id="delItem">Supprimer cet équipement</button>'}
    <button type="submit" hidden></button></form>`, f => {
    const name = f.name.value.trim();
    if (!name) { toast('Indiquez un nom'); f.name.focus(); return false; }
    const data = { kind: f.kind.value, name, info: f.info.value.trim(), km: KINDS[f.kind.value].km ? num(f.km.value) : null };
    if (data.km != null && isNaN(data.km)) data.km = null;
    if (isNew) { const n = { id: uid(), ...data }; db.items.push(n); save(); go({ name: 'item', id: n.id }); }
    else { Object.assign(it, data); save(); render(); }
    toast('Enregistré');
  });
  const syncKm = () => $('#kmWrap').style.display = KINDS[$('#fKind').value].km ? '' : 'none';
  $('#fKind').onchange = syncKm; syncKm();
  $('#delItem') && ($('#delItem').onclick = () => {
    if (!confirm(`Supprimer « ${it.name} » et tout son historique ?`)) return;
    db.items = db.items.filter(i => i.id !== it.id);
    db.entries = db.entries.filter(e => e.itemId !== it.id);
    save(); closeSheet(); go({ name: 'home' }); toast('Supprimé');
  });
}

function openEntryForm(e) {
  const isNew = !e.id;
  e = { date: today(), ...e };
  if (!e.itemId) e.itemId = db.items[0].id;
  const itemOpts = db.items.map(i => `<option value="${i.id}" ${i.id === e.itemId ? 'selected' : ''}>${KINDS[i.kind]?.e || ''} ${esc(i.name)}</option>`).join('');
  openSheet(isNew ? 'Nouvelle intervention' : 'Intervention', `<form autocomplete="off">
    <label for="fItem">Équipement</label><select id="fItem" name="itemId">${itemOpts}</select>
    <label for="fTitle">Intervention</label><input id="fTitle" name="title" required placeholder="ex. Vidange" value="${esc(e.title || '')}">
    <div class="chips" id="chips"></div>
    <div class="grid2">
      <div><label for="fDate">Date</label><input id="fDate" type="date" name="date" value="${esc(e.date)}"></div>
      <div><label for="fCost">Coût (€)</label><input id="fCost" name="cost" inputmode="decimal" placeholder="0" value="${e.cost ?? ''}"></div>
    </div>
    <div id="eKmWrap"><label for="fEKm">Kilométrage</label><input id="fEKm" name="km" inputmode="numeric" value="${e.km ?? ''}"></div>
    <label for="fProv">Garage / prestataire</label><input id="fProv" name="provider" value="${esc(e.provider || '')}">
    <label for="fNotes">Notes</label><textarea id="fNotes" name="notes" placeholder="Pièces changées, n° de facture…">${esc(e.notes || '')}</textarea>
    <h2 style="margin-left:4px">Prochain entretien</h2>
    <div class="grid2">
      <div><label for="fNDate">Date</label><input id="fNDate" type="date" name="nextDate" value="${esc(e.nextDate || '')}"></div>
      <div id="nKmWrap"><label for="fNKm">Ou à (km)</label><input id="fNKm" name="nextKm" inputmode="numeric" value="${e.nextKm ?? ''}"></div>
    </div>
    <div class="chips"><button type="button" class="chip" data-m="6">+6 mois</button>
      <button type="button" class="chip" data-m="12">+1 an</button><button type="button" class="chip" data-m="24">+2 ans</button>
      <button type="button" class="chip" data-m="0">Aucun</button></div>
    ${isNew ? '' : '<button type="button" class="btn danger" id="delEntry">Supprimer</button>'}
    <button type="submit" hidden></button></form>`, f => {
    const title = f.title.value.trim();
    if (!title) { toast("Indiquez l'intervention"); f.title.focus(); return false; }
    const item = itemById(f.itemId.value), hasKm = KINDS[item.kind]?.km;
    const clean = v => { const n = num(v); return n == null || isNaN(n) ? null : n; };
    const data = { itemId: item.id, title, date: f.date.value || today(), cost: clean(f.cost.value),
      km: hasKm ? clean(f.km.value) : null, provider: f.provider.value.trim(), notes: f.notes.value.trim(),
      nextDate: f.nextDate.value || null, nextKm: hasKm ? clean(f.nextKm.value) : null };
    if (isNew) db.entries.push({ id: uid(), ...data });
    else Object.assign(db.entries.find(x => x.id === e.id), data);
    if (data.km != null && (item.km == null || data.km > item.km)) item.km = data.km;
    save();
    if (view.name === 'item' && view.id !== item.id) view = { name: 'item', id: item.id };
    render(); toast('Enregistré');
  });
  const syncKind = () => {
    const it = itemById($('#fItem').value), k = it.kind;
    const hasKm = KINDS[k]?.km;
    $('#eKmWrap').style.display = $('#nKmWrap').style.display = hasKm ? '' : 'none';
    if (hasKm && isNew && !$('#fEKm').value && it.km != null) $('#fEKm').placeholder = String(it.km);
    $('#chips').innerHTML = (SUGGEST[k] || SUGGEST.autre).map(s => `<button type="button" class="chip">${esc(s)}</button>`).join('');
    $('#chips').querySelectorAll('.chip').forEach(c => c.onclick = () => { $('#fTitle').value = c.textContent; });
  };
  $('#fItem').onchange = syncKind; syncKind();
  $('#sheet').querySelectorAll('[data-m]').forEach(c => c.onclick = () => {
    const m = Number(c.dataset.m);
    $('#fNDate').value = m ? addMonths($('#fDate').value, m) : '';
    if (!m) $('#fNKm').value = '';
  });
  $('#delEntry') && ($('#delEntry').onclick = () => {
    if (!confirm('Supprimer cette intervention ?')) return;
    db.entries = db.entries.filter(x => x.id !== e.id);
    save(); closeSheet(); render(); toast('Supprimé');
  });
}

/* ---------- Sauvegarde / restauration ---------- */
async function exportData() {
  const json = JSON.stringify({ app: 'carnet-entretien', version: 1, exportedAt: new Date().toISOString(), ...db }, null, 2);
  const name = `carnet-entretien-${today()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items) || !Array.isArray(d.entries)) throw new Error();
    if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${d.items.length} équipement(s), ${d.entries.length} intervention(s)) ?`)) return;
    db = { items: d.items, entries: d.entries }; save(); go({ name: 'home' }); toast('Sauvegarde importée');
  } catch (e) { toast('Fichier invalide'); }
};

/* ---------- Démarrage ---------- */
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
