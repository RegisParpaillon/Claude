<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma séance</title>
<meta name="description" content="Générateur de séances de musculation (push/pull/legs) et de running adaptées à ma forme et mon niveau.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Séance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<div class="timer" id="timer" role="timer" aria-live="off"></div>
<nav class="tabs" id="tabs"></nav>
<div class="celebrate" id="celebrate"></div>
<div class="busy" id="busy"><div><div class="spinner"></div><span></span></div></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript>Cette application nécessite JavaScript.</noscript>
<script>
// Filet de sécurité : si l'app ne s'est pas affichée (fichiers d'anciennes et nouvelles versions mélangés),
// proposer de vider le cache hors ligne puis de recharger. Les données (séances, progression) ne sont pas touchées.
setTimeout(function () {
  var app = document.getElementById('app');
  if (app && app.children.length) return;
  app.innerHTML = '<div style="padding:40px 16px;text-align:center"><p style="font-size:18px"><b>Mise à jour en cours…</b></p>' +
    '<p style="color:#6b7280">L’app n’a pas pu se charger complètement. Vos données sont conservées.</p>' +
    '<button id="repair" style="margin-top:12px;padding:14px 22px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font:600 17px -apple-system,sans-serif">🔧 Réparer et recharger</button></div>';
  document.getElementById('repair').onclick = function () {
    var p = [];
    if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    Promise.all(p).finally(function () { location.replace(location.pathname + '?v=' + Date.now() + location.hash); });
  };
}, 6000);
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
